name: Update script store

# The manager downloads scripts/dist straight out of this branch, so a script change has to
# be compiled and committed here rather than published to a branch of its own.
on:
  push:
    branches: [ ui, dev, main ]
    paths:
      - 'scripts/src/**'
      - 'scripts/build.js'
      - 'scripts/package.json'
      - 'scripts/package-lock.json'
  workflow_dispatch:

concurrency:
  group: update-scripts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    name: Rebuild the script store
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Build the script store
        working-directory: scripts
        run: |
          npm ci
          npm run build:dist

      - name: Commit the store when it changed
        run: |
          if [ -z "$(git status --porcelain scripts/dist)" ]; then
            echo "The store is already up to date."
            exit 0
          fi

          git config user.name fkiab
          git config user.email fkiab@users.noreply.github.com
          git add scripts/dist
          git commit -m "chore(scripts): refresh the published store"
          git push
