plugins {
    alias(libs.plugins.android.application)
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def scriptsBaseUrl = project.findProperty('scriptsBaseUrl')
        ?: localProperties.getProperty('scriptsBaseUrl')
        ?: System.getenv('GITHUB_REPOSITORY')?.with {
            "https://raw.githubusercontent.com//HEAD/scripts/dist/"
        }
        ?: ''

android {
    namespace 'com.fuck.iab'
    compileSdk 37

    defaultConfig {
        applicationId "com.fuck.iab"
        minSdk 26
        targetSdk 37
        versionCode 40
        versionName "1.6.6"

        buildConfigField "String", "SCRIPTS_BASE_URL", "\"\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            debugSymbolLevel 'none'
        }
    }

        signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_FILE") ?: '../keystore/fkiab-ci.jks')
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS") ?: 'fkiab'
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            optimization {
                enable true
            }
            proguardFiles 'proguard-rules.pro'

            if (System.getenv("KEYSTORE_FILE") != null && System.getenv("KEYSTORE_PASSWORD") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
            universalApk true
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    ndkVersion = "30.0.16248370"
}

dependencies {
    implementation("androidx.viewpager2:viewpager2:1.1.0")
    implementation "androidx.fragment:fragment-ktx:1.9.0"
    implementation "com.google.android.material:material:1.14.0"
    implementation("io.github.libxposed:service:102.0.0")
    implementation libs.appcompat
    compileOnly(libs.libxposed)
    implementation libs.dexkit
}

import javax.inject.Inject

abstract class CompileFridaScriptsTask extends DefaultTask {

    @Inject
    abstract ExecOperations getExecOperations()

    @Internal
    abstract DirectoryProperty getScriptsSrcDir()

    @Internal
    abstract DirectoryProperty getScriptsWorkingDir()

    @Internal
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void run() {
        def workDir = scriptsWorkingDir.get().asFile
        def outDir = outputDir.get().asFile

        if (!new File(workDir, 'node_modules/frida-compile').exists()) {
            logger.warn("Frida compile not found in node_modules, skipping compilation")
            return
        }

        outDir.mkdirs()

        logger.lifecycle("Compiling Frida scripts into ")

        def isWindows = org.gradle.internal.os.OperatingSystem.current().isWindows()

        execOperations.exec {
            workingDir = workDir
            commandLine isWindows ? 'node.exe' : 'node', 'build.js', '--all'
        }
    }
}

tasks.register('compileFridaScripts', CompileFridaScriptsTask) {
    group = 'frida'
    description = 'Compile the global script in scripts/src into assets/scripts/global.js'

    scriptsSrcDir.set(layout.projectDirectory.dir('../scripts/src'))
    scriptsWorkingDir.set(layout.projectDirectory.dir('../scripts'))
    outputDir.set(layout.projectDirectory.dir('src/main/assets/scripts'))

    inputs.dir(scriptsSrcDir)
    outputs.dir(outputDir)
}

tasks.named('preBuild') {
    dependsOn 'compileFridaScripts'
}