plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.fuck.iab'
    compileSdk 37

    defaultConfig {
        applicationId "com.fuck.iab"
        minSdk 29
        targetSdk 37
        versionCode 28
        versionName "1.5.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            debugSymbolLevel 'none'
        }
    }

    buildTypes {
        release {
            optimization {
                enable true
            }
            proguardFiles 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
            universalApk true
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    ndkVersion = "30.0.16248370"
}

dependencies {
    implementation("androidx.viewpager2:viewpager2:1.1.0")
    implementation "androidx.fragment:fragment-ktx:1.9.0"
    implementation "com.google.android.material:material:1.14.0"
    implementation("io.github.libxposed:service:102.0.0")
    implementation libs.appcompat
    compileOnly(libs.libxposed)
    implementation libs.dexkit
}

import javax.inject.Inject

abstract class CompileFridaScriptsTask extends DefaultTask {

    @Inject
    abstract ExecOperations getExecOperations()

    @Internal
    abstract DirectoryProperty getScriptsSrcDir()

    @Internal
    abstract DirectoryProperty getScriptsWorkingDir()

    @Internal
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void run() {
        def srcDir = scriptsSrcDir.get().asFile
        def workDir = scriptsWorkingDir.get().asFile
        def outDir = outputDir.get().asFile

        outDir.mkdirs()

        def staleFiles = outDir.listFiles { f -> f.isFile() && f.name.endsWith('.js') } ?: []
        staleFiles.each { f ->
            logger.lifecycle("Removed stale: ${f.name}")
            f.delete()
        }

        def isWindows = org.gradle.internal.os.OperatingSystem.current().isWindows()
        def npxCommand = isWindows ? 'npx.cmd' : 'npx'

        def scriptFiles = srcDir.listFiles { f ->
            f.isFile() && f.name.endsWith('.ts')
        } ?: []

        if (scriptFiles.size() == 0) {
            logger.warn("No .ts files found under ${srcDir.path}")
        }

        scriptFiles.each { entry ->
            def packageName = entry.name - '.ts'
            def outputFile = new File(outDir, "${packageName}.js")

            logger.lifecycle("Compiling: ${entry.name} -> assets/scripts/${packageName}.js")

            execOperations.exec {
                workingDir = workDir
                commandLine npxCommand, 'frida-compile',
                        entry.absolutePath,
                        '-o', outputFile.absolutePath,
                        '-c', '-S', '-B', 'iife'
            }
        }
    }
}

tasks.register('compileFridaScripts', CompileFridaScriptsTask) {
    group = 'frida'
    description = 'Compile each TypeScript script into assets/scripts/<package>.js'

    scriptsSrcDir.set(layout.projectDirectory.dir('../scripts/src'))
    scriptsWorkingDir.set(layout.projectDirectory.dir('../scripts'))
    outputDir.set(layout.projectDirectory.dir('src/main/assets/scripts'))

    inputs.dir(scriptsSrcDir)
    outputs.dir(outputDir)
}