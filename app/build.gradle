plugins {
    alias(libs.plugins.android.application)
}

// Where the manager updates its per-app scripts from. The address is not part of the
// repository: pass -PscriptsBaseUrl=..., or put scriptsBaseUrl in local.properties, which is
// not committed. CI falls back to GITHUB_REPOSITORY, so any fork builds its own store.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def scriptsBaseUrl = project.findProperty('scriptsBaseUrl')
        ?: localProperties.getProperty('scriptsBaseUrl')
        ?: System.getenv('GITHUB_REPOSITORY')?.with {
            "https://raw.githubusercontent.com/${it}/HEAD/scripts/dist/"
        }
        ?: ''

android {
    namespace 'com.fuck.iab'
    compileSdk 37

    defaultConfig {
        applicationId "com.fuck.iab"
        minSdk 26
        targetSdk 37
        versionCode 39
        versionName "1.6.5"

        // An empty value means this build has no store, which the Scripts screen says
        // instead of offering an update that cannot work.
        buildConfigField "String", "SCRIPTS_BASE_URL", "\"${scriptsBaseUrl}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            debugSymbolLevel 'none'
        }
    }

    signingConfigs {
        release {
            // CI decodes the repository secret into KEYSTORE_FILE and sets the rest.
            storeFile file(System.getenv("KEYSTORE_FILE") ?: '../keystore/fkiab-ci.jks')
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS") ?: 'fkiab'
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            optimization {
                enable true
            }
            proguardFiles 'proguard-rules.pro'

            // Only sign when the key is available, so a plain local build still works.
            if (System.getenv("KEYSTORE_FILE") != null && System.getenv("KEYSTORE_PASSWORD") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    splits {
        abi {
            enable true
            reset()
            // Only the two ABIs the module is used on; the devkit is built for these.
            include "arm64-v8a", "armeabi-v7a"
            universalApk true
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    ndkVersion = "30.0.16248370"
}

dependencies {
    implementation("androidx.viewpager2:viewpager2:1.1.0")
    implementation "androidx.fragment:fragment-ktx:1.9.0"
    implementation "com.google.android.material:material:1.14.0"
    implementation("io.github.libxposed:service:102.0.0")
    implementation libs.appcompat
    compileOnly(libs.libxposed)
    implementation libs.dexkit
}

import javax.inject.Inject

abstract class CompileFridaScriptsTask extends DefaultTask {

    @Inject
    abstract ExecOperations getExecOperations()

    @Internal
    abstract DirectoryProperty getScriptsSrcDir()

    @Internal
    abstract DirectoryProperty getScriptsWorkingDir()

    @Internal
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void run() {
        def workDir = scriptsWorkingDir.get().asFile
        def outDir = outputDir.get().asFile

        // build.js compiles the global script, which is the only one packaged into the apk,
        // and clears the files of removed scripts first. Per-app scripts live in scripts/dist
        // and reach a device through the store instead.
        if (!new File(workDir, 'node_modules/frida-compile').exists()) {
            throw new GradleException(
                    "Frida scripts cannot be compiled: run `npm install` in ${workDir.path} first.")
        }

        outDir.mkdirs()

        logger.lifecycle("Compiling Frida scripts into ${outDir.path}")

        def isWindows = org.gradle.internal.os.OperatingSystem.current().isWindows()

        execOperations.exec {
            workingDir = workDir
            commandLine isWindows ? 'node.exe' : 'node', 'build.js', '--all'
        }
    }
}

tasks.register('compileFridaScripts', CompileFridaScriptsTask) {
    group = 'frida'
    description = 'Compile the global script in scripts/src into assets/scripts/global.js'

    scriptsSrcDir.set(layout.projectDirectory.dir('../scripts/src'))
    scriptsWorkingDir.set(layout.projectDirectory.dir('../scripts'))
    outputDir.set(layout.projectDirectory.dir('src/main/assets/scripts'))

    inputs.dir(scriptsSrcDir)
    outputs.dir(outputDir)
}

// The assets have to exist before they are merged, so every build compiles them.
tasks.named('preBuild') {
    dependsOn 'compileFridaScripts'
}